name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Unzip project if uploaded as zip
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP" ]; then
            mkdir -p unzipped
            unzip -q -o "$ZIP" -d unzipped
          fi

      - name: Build debug APK
        run: |
          SETTINGS=$(find . \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -not -path "*/.git/*" | head -n 1)
          [ -z "$SETTINGS" ] && echo "No Gradle project found" && exit 1
          cd "$(dirname "$SETTINGS")"
          echo "org.gradle.jvmargs=-Xmx3g" >> gradle.properties
          if [ -f gradlew ]; then
            chmod +x gradlew
            CMD="./gradlew"
          else
            CMD="gradle"
          fi
          set +e
          $CMD assembleDebug --console=plain > build.log 2>&1
          STATUS=$?
          echo "=========== ERROR SUMMARY ==========="
          grep -n -A10 -E "What went wrong|error:|^e: |FAILURE" build.log | head -60
          echo "====================================="
          exit $STATUS

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: "**/build.log"
